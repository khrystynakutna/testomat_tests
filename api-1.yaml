  /api/v2/{project_id}/runs/{id}/launch:
    post:
      summary: Launch a run on CI
      description: >
        Triggers the CI integration configured under `profile` in the project's
        CI settings

        to run this automated (or mixed) run. A `400` is returned when the CI
        provider itself

        rejects the dispatch (e.g. misconfigured workflow); in that case the run
        is marked

        as crashed/terminated.
      operationId: launchRun
      tags:
        - Runs
      parameters:
        - $ref: "#/components/parameters/projectId"
        - $ref: "#/components/parameters/resourceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - profile
              properties:
                profile:
                  type: string
                  description: CI profile key configured in the project's CI settings (e.g.
                    `github`).
                grep_from_run:
                  type: boolean
                  description: >
                    If true, sends the public IDs of automated tests already
                    present as testruns on

                    this run to CI in the `grep` input field. Requires grep to
                    be enabled on the CI

                    profile.
                plan_id:
                  type: string
                  description: >
                    Public UID of a test plan. If given, sends the public IDs of
                    the automated tests

                    from that plan to CI in the `grep` input field. Requires
                    grep to be enabled on

                    the CI profile. Combinable with `grep_from_run`: the two
                    resulting test sets are

                    merged.
      responses:
        "200":
          description: Run launched
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Run"
        "400":
          description: CI provider rejected the launch request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
