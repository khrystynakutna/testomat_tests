      operationId: updateDefect
      tags:
        - Defects
      parameters:
        - $ref: "#/components/parameters/projectId"
        - name: id
          in: path
          required: true
          description: Defect ID (8-char)
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DefectUpdateInput"
      responses:
        "200":
          description: Defect updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Defect"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
    delete:
      summary: Delete a defect
      operationId: deleteDefect
      tags:
        - Defects
      parameters:
        - $ref: "#/components/parameters/projectId"
        - name: id
          in: path
          required: true
          description: Defect ID (8-char)
          schema:
            type: string
      responses:
        "204":
          description: Defect deleted
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v2/{project_id}/defects/{id}/refresh:
    post:
      summary: Refresh a defect from its tracker
      operationId: refreshDefect
      tags:
        - Defects
      description: Synchronously re-syncs one defect with its tracker (status,
        description, severity, comments).
      parameters:
        - $ref: "#/components/parameters/projectId"
        - name: id
          in: path
          required: true
          description: Defect ID (8-char)
          schema:
            type: string
      responses:
        "200":
          description: Refreshed defect
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Defect"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v2/{project_id}/defects/sync:
    post:
      summary: Schedule a defects sync
      operationId: syncDefects
      tags:
        - Defects
      description: Enqueues a background job to sync all of the project's defects with
        their trackers.
      parameters:
        - $ref: "#/components/parameters/projectId"
      responses:
        "202":
          description: Sync scheduled
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
  /api/v2/{project_id}/sessions:
    post:
      summary: Start a session
      operationId: createSession
      tags:
        - Sessions
      description: |
        Creates a new session that groups subsequent API changes under a single
        history entry. Pass the returned hash in the X-Session-Hash header on
        subsequent requests. Sessions expire after 30 minutes.
      parameters:
        - $ref: "#/components/parameters/projectId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                description:
                  type: string
                  description: Optional description shown in project history
      responses:
        "201":
          description: Session started
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      hash:
                        type: string
                        description: Session hash to pass in X-Session-Hash header
                      version_id:
                        type: string
                        description: Parent version ID for reviewing and reverting session changes
                      description:
                        type: string
                      expires_in:
                        type: integer
                        description: Session TTL in seconds
                      created_at:
                        type: string
                        format: date-time
  /api/v2/{project_id}/sessions/{id}:
    delete:
      summary: Stop a session
      operationId: deleteSession
      tags:
        - Sessions
      description: |
        Stops an active session and removes it from the server.
        Subsequent requests with this session hash will be rejected.
      parameters:
        - $ref: "#/components/parameters/projectId"
        - name: id
          in: path
          required: true
          description: Session hash
          schema:
            type: string
      responses:
        "204":
          description: Session stopped
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v2/{project_id}/attachments:
    get:
      summary: List attachments for a resource
      operationId: listAttachments
      tags:
        - Attachments
      parameters:
        - $ref: "#/components/parameters/projectId"
        - name: test_id
          in: query
          description: Public UID of the test
          schema:
            type: string
        - name: suite_id
          in: query
          description: Public UID of the suite
          schema:
            type: string
        - name: testrun_id
          in: query
          description: Integer ID of the testrun
          schema:
            type: integer
        - name: defect_id
          in: query
          description: Public UID of the defect
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: per_page
          in: query
          schema:
            type: integer
            default: 30
            maximum: 100
      responses:
        "200":
          description: List of attachments
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Attachment"
                  meta:
                    $ref: "#/components/schemas/PaginationMeta"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
    post:
      summary: Upload one or more attachments
      operationId: createAttachment
      tags:
        - Attachments
      description: >
        Uploads one or more files (up to 10 per request) and attaches them to
        the

        specified resource. If a file with the same MD5 checksum already exists
        on

        the resource, the existing attachment is returned for it instead of
        creating

        a duplicate — duplicates and newly created attachments are both included
        in

        the same response, with no separate status per file.
      parameters:
        - $ref: "#/components/parameters/projectId"
        - name: test_id
          in: query
          description: Public UID of the test
          schema:
            type: string
        - name: suite_id
          in: query
          description: Public UID of the suite
          schema:
            type: string
        - name: testrun_id
          in: query
          description: Integer ID of the testrun
          schema:
            type: integer
        - name: defect_id
          in: query
          description: Public UID of the defect
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - files
              properties:
                files:
                  type: array
                  maxItems: 10
                  items:
                    type: string
                    format: binary
                  description: Files to upload (max 10 per request)
      responses:
        "200":
          description: Attachments uploaded (includes both newly created and pre-existing
            duplicate attachments)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Attachment"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: No files provided, more than 10 files, or a disallowed file type
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v2/{project_id}/attachments/{id}:
    delete:
      summary: Delete an attachment
      operationId: deleteAttachment
      tags:
        - Attachments
      parameters:
        - $ref: "#/components/parameters/projectId"
        - name: id
          in: path
          required: true
          description: Attachment public UID
          schema:
            type: string
        - name: test_id
          in: query
          description: Public UID of the test
          schema:
            type: string
        - name: suite_id
          in: query
          description: Public UID of the suite
          schema:
            type: string
        - name: testrun_id
          in: query
          description: Integer ID of the testrun
          schema:
            type: integer
        - name: defect_id
          in: query
          description: Public UID of the defect
          schema:
            type: string
      responses:
        "204":
          description: Attachment deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /api/v2/{project_id}/branches:
    get:
      summary: List branches
      operationId: listBranches
      tags:
        - Branches
      parameters:
        - $ref: "#/components/parameters/projectId"
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/perPage"
        - name: filter[state]
          in: query
          description: Filter by branch state.
          schema:
            type: string
            enum:
              - active
              - merged
        - name: filter[title]
          in: query
          description: Filter by title (partial substring match).
          schema:
            type: string
      responses:
        "200":
          description: Paginated list of branches
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Branch"
                  meta:
                    $ref: "#/components/schemas/PaginationMeta"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      summary: Create a branch
      operationId: createBranch
      tags:
        - Branches
      parameters:
        - $ref: "#/components/parameters/projectId"
        - $ref: "#/components/parameters/sessionHash"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BranchInput"
      responses:
        "201":
          description: Branch created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Branch"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /api/v2/{project_id}/branches/{id}:
    get:
      summary: Get a branch
      operationId: getBranch
      tags:
        - Branches
      parameters:
        - $ref: "#/components/parameters/projectId"
        - name: id
          in: path
