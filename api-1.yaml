  /api/v2/{project_id}/suites/{id}/reorder:
    patch:
      summary: Reorder tests within a suite
      operationId: reorderSuiteTests
      tags:
        - Suites
      description: >
        Sets new positions for one or more tests within the suite in a single
        call.

        Tests not mentioned in `positions` keep their relative order around the
        moved tests.
      parameters:
        - $ref: "#/components/parameters/projectId"
        - $ref: "#/components/parameters/resourceId"
        - name: positions
          in: query
          required: true
          description: >
            Semicolon-separated list of `testId=position` pairs, e.g.
            `a1b2c3d4=1;e5f6a7b8=2`.

            Test IDs are 8-character public UIDs (without the `T` prefix). Pairs
            with an unknown

            or malformed test ID/position are silently ignored.
          schema:
            type: string
      responses:
        "200":
          description: Suite with reordered tests
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Suite"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /api/v2/{project_id}/suites/markdown_import:
    post:
      summary: Import suites and tests from markdown
      operationId: markdownImportSuites
      tags:
        - Suites
      description: >
        Accepts markdown content (as a string or uploaded `.md` files) and
        imports suites

        and tests from it.
      parameters:
        - $ref: "#/components/parameters/projectId"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                markdown:
                  type: string
                  description: Markdown content to import.
                folder_id:
                  type: string
                  description: Public UID of an existing folder suite. New suites will be created
                    under this folder.
                folder:
                  type: string
                  description: >
                    Folder path (e.g. `fol1/fol2`). Missing folders are created
                    automatically.

                    When combined with `folder_id`, the path is resolved
                    relative to that folder.
          multipart/form-data:
            schema:
              type: object
              properties:
                files:
                  type: array
                  items:
                    type: string
                    format: binary
                  description: One or more `.md` files to import.
                folder_id:
                  type: string
                  description: Public UID of an existing folder suite.
                folder:
                  type: string
                  description: Folder path (e.g. `fol1/fol2`).
      responses:
        "200":
          description: Import accepted and queued for processing.
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
