  /api/v2/{project_id}/defects:
    get:
      summary: List defects
      operationId: listDefects
      tags:
        - Defects
      parameters:
        - $ref: "#/components/parameters/projectId"
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/perPage"
        - name: status
          in: query
          description: Filter by status
          schema:
            type: string
            enum:
              - opened
              - closed
        - name: source_type
          in: query
          description: Filter by tracker provider
          schema:
            type: string
        - name: severity
          in: query
          description: Filter by severity
          schema:
            type: string
            enum:
              - critical
              - high
              - medium
              - low
        - name: jira_project
          in: query
          description: Filter by connected Jira project key (defects linked to that project)
          schema:
            type: string
        - name: test_id
          in: query
          description: Return only defects linked to this test (public UID). Unknown id
            returns 404.
          schema:
            type: string
        - name: with_testruns
          in: query
          description: With `test_id`, also return the defects of every test run of that
            test.
          schema:
            type: boolean
        - name: opened_range
          in: query
          description: Filter by opened_at date range, "from,to" (e.g.
            "2026-01-01,2026-02-01")
          schema:
            type: string
        - name: closed_range
          in: query
          description: Filter by closed_at date range, "from,to"
          schema:
            type: string
        - name: query
          in: query
          description: "Full-text search over title and source_key (alias: search)"
          schema:
            type: string
        - name: labels
          in: query
          description: Filter by label slugs (comma-separated; supports "Slug:Value")
          schema:
            type: string
        - name: milestone
          in: query
          description: "Filter by milestone slug (alias: `milestones`, comma-separated).
            Matches directly assigned defects and defects affecting the
            milestone's runs. Unknown slug returns 404."
          schema:
            type: string
      responses:
        "200":
          description: Paginated list of defects
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Defect"
                  meta:
                    $ref: "#/components/schemas/PaginationMeta"
    post:
      summary: Create a defect
      operationId: createDefect
      tags:
        - Defects
      description: >
        Register an existing tracker issue (source_key as an issue key or URL,
        source_type optional

        when derivable), or create the remote tracker issue together with the
        defect (profile or

        jiraproject_id). Registering an issue that already resolves to a known
        defect returns that

        defect with 200 instead of creating a duplicate.
      parameters:
        - $ref: "#/components/parameters/projectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DefectCreateInput"
      responses:
        "200":
          description: Existing defect returned (duplicate source_type + source_key)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Defect"
        "201":
          description: Defect created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Defect"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /api/v2/{project_id}/defects/{id}:
    get:
      summary: Get a defect
      operationId: getDefect
      tags:
        - Defects
      parameters:
        - $ref: "#/components/parameters/projectId"
        - name: id
          in: path
          required: true
          description: Defect ID (8-char)
          schema:
            type: string
      responses:
        "200":
          description: Defect details (includes description, comments, affected_* counts,
            milestones)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Defect"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
